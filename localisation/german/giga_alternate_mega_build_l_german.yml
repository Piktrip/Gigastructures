  giga_supertensiles_subsidies:0 "Megakonstruktion Beitrag"
  giga_supertensiles_subsidies_desc:0 "Diese Bedingung legt die Menge an £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! fest, die der Untergebene dem Oberherren monatlich zahlen muss. Die Zahl ist ein Prozentsatz der aktuellen monatlichen Produktion des Untergebenen.\n\nEin negativer Wert bedeutet, dass der Oberherr verpflichtet ist, den Untergebenen zu zahlen anstatt umgekehrt, basiert aber weiterhin auf einem Prozentsatz der aktuellen monatlichen Produktion des Untergebenen.\n\n§EDiese Bedingung befindet sich aufgrund einer Engine-Einschränkung in einer separaten Kategorie, bei der bedingt ausgeblendete Ressourcenkategorien Untertanenvereinbarungen beeinträchtigen. Wenn das Problem behoben ist, wird sie zurück in die Beitragskategorie verschoben.§!"
  
  giga_resource_subsidies_supertensiles:0 "Supertensile"
  
  giga_supertensiles_prospectorium_bonus_subject_1:0 "$mod_country_giga_sr_amb_megaconstruction_produces_mult$: §G+10%§!\nDieser Bonus steigt mit der Spezialistenstufe."
  giga_supertensiles_prospectorium_bonus_subject_2:0 "$mod_country_giga_sr_amb_megaconstruction_produces_mult$: §G+20%§!\nDieser Bonus steigt mit der Spezialistenstufe."
