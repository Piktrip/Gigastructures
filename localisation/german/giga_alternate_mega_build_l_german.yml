  d_giga_hab_supertensiles_1:99 "$giga_sr_amb_megaconstruction$ Deposit"
  d_giga_hab_supertensiles_1_desc:99 "This Habitat Complex is built near an exploitable supertensile materials deposit."
  
  d_giga_lifeless_supertensiles_1:99 "$giga_sr_amb_megaconstruction$ Deposit"
