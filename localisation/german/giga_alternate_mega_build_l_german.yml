  building_giga_megaworkshop:0 "Molekularschmiede"
  building_giga_megaworkshop_plural:0 "Molekularschmieden"
  building_giga_megaworkshop_desc:0 "Molekulare Syntheseanlagen und makellose Reinräume füllen diese Einrichtungen, in denen die hochspezialisierten Materialien für großangelegte orbitale Bauprojekte hergestellt werden."
  mod_planet_building_giga_megaworkshop_build_speed_mult:0 "$building_giga_megaworkshop$ Baugeschwindigkeit"
  
  building_giga_megaworkshop_hub:0 "Megakonstruktion Logistikzentrum"
  building_giga_megaworkshop_hub_plural:0 "Megakonstruktion Logistikzentren"
  building_giga_megaworkshop_hub_desc:0 "Experten koordinieren eine riesige Flotte von Transport- und Konstruktionsschiffen, die ihre großartigen Entwürfe voranbringen, während Molekularschmieden gewaltige Mengen an Baumaterialien produzieren."
  building_giga_megaworkshop_hub_count_condition:0 ""
  mod_planet_building_giga_megaworkshop_hub_build_speed_mult:0 "$building_giga_megaworkshop_hub$ Baugeschwindigkeit"
  
  building_giga_supertensiles_mines:0 "$giga_sr_amb_megaconstruction$ Extraktoren"
  building_giga_supertensiles_mines_plural:0 "$giga_sr_amb_megaconstruction$ Extraktoren"
  building_giga_supertensiles_mines_desc:0 "In seltenen Fällen können die richtigen Bedingungen dazu führen, dass sich Materialien von unwahrscheinlicher Stärke in der Natur bilden."
  mod_building_giga_supertensiles_mines_max:0 "Max $building_giga_supertensiles_mines$"
  
  building_giga_living_metal_infusion_plant:0 "Lebendes Metall Infusionsanlage"
  building_giga_living_metal_infusion_plant_plural:0 "Lebendes Metall Infusionsanlagen"
  building_giga_living_metal_infusion_plant_desc:0 "Die Integration der regenerativen Eigenschaften von lebendem Metall in unsere Herstellungsprozesse wird ein großer Segen für unsere Weltraum Bauprojekte sein."
  
  building_giga_fe_megaworkshop:0 "Nano Montagewerk"
  building_giga_fe_megaworkshop_plural:0 "Nano Montagewerke"
  building_giga_fe_megaworkshop_desc:0 "Riesige molekulare Syntheseanlagen arbeiten gemeinsam mit Replikator Buchten, um Rohmineralien in Materialien für orbitale Konstruktionen zu verarbeiten."
  
  building_giga_fe_megaworkshop_2:0 "Polyatomarer Schmelztiegel"
  building_giga_fe_megaworkshop_2_plural:0 "Polyatomare Schmelztiegel"
  building_giga_fe_megaworkshop_2_desc:0 "Diese Anlagen verdrehen die Schwerkraft, um Atome in stabile Anordnungen zu binden, die einst für unmöglich gehalten wurden."
  
  holding_giga_megaworkshop:0 "Megalogistik Exportwerft"
  holding_giga_megaworkshop_plural:0 "Megalogistik Exportwerften"
  holding_giga_megaworkshop_desc:0 "Molekularschmieden im Besitz eines fremden Reiches nutzen lokale Ressourcen für ferne Bauprojekte. Manche würden sie sogar Prestigeprojekte nennen."
